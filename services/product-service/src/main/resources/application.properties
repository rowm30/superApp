spring.application.name=product-service
server.port=8083

# Database ka pata. 5433 = laptop ka port jo Docker ke Postgres pe jaata hai
spring.datasource.url=jdbc:postgresql://localhost:5433/superapp
spring.datasource.username=superapp
spring.datasource.password=superapp

# "none" = Hibernate se boldo ki table BILKUL mat banao.
# Default kabhi-kabhi tables khud bana deta hai ? production mein ye khatarnaak hai
# kyunki koi record nahi rehta ki table kaise badla. Table Flyway banayega, agle step mein.
spring.jpa.hibernate.ddl-auto=none

# Hibernate jo SQL chalata hai wo console mein dikhao. Seekhne ke liye on rakho.
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Wrapper ? andar wala fail ho toh null deta hai, consumer atakta nahi
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Producer ki class ka naam ignore karo, hamesha apni default type use karo
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.superapp.product.events.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.superapp.product.events