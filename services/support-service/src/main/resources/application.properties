spring.application.name=support-service


server.port=8085


spring.datasource.url=jdbc:postgresql://localhost:5433/support
spring.datasource.username=superapp
spring.datasource.password=superapp

# ?? Anthropic (chat) ??
# ${...} = environment variable se padho. Key file mein kabhi mat likhna ?
# git mein chali gayi toh Anthropic key turant revoke kar dega
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001
# temperature 0 = same sawaal ka same jawab. Testing/eval ke liye zaroori,
# warna baad mein jo eval tests banayenge wo har run pe alag score denge
spring.ai.anthropic.chat.options.temperature=0.0
spring.ai.anthropic.chat.options.max-tokens=1024

# Model ab JAR ke andar se aayega, internet se nahi ?
# GitHub domains network pe block hain isliye local copy use kar rahe hain
spring.ai.embedding.transformer.onnx.model-uri=classpath:/onnx-model/model.onnx
spring.ai.embedding.transformer.tokenizer.uri=classpath:/onnx-model/tokenizer.json

spring.ai.vectorstore.pgvector.dimensions=384

spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

spring.ai.vectorstore.pgvector.initialize-schema=true