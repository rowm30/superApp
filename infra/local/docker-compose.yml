services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: superapp-keycloak
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
  postgres:
    image: postgres:17
    container_name: superapp-postgres
    environment:
      POSTGRES_DB: superapp
      POSTGRES_USER: superapp
      POSTGRES_PASSWORD: superapp
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  keycloak-data:
  postgres-data:
